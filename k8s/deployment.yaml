apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhlplayoffapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nhlplayoffapp
  template:
    metadata:
      labels:
        app: nhlplayoffapp
    spec:
      containers:
      - name: nhlplayoffapp-container
        image: ghcr.io/brandonmichaelhunter/nhlplayoffapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        # --- HEALTH PROBES START HERE ---
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        # --- HEALTH PROBES END HERE ---
        # ADD THIS BLOCK TO FIX THE "INSUFFICIENT CPU" ERROR
        resources:
          requests:
            cpu: "50m"      # Only asks for 5% of a single CPU core per pod
            memory: "64Mi"  # Asks for 64MB of RAM
          limits:
            cpu: "200m"     # Allows the pod to burst to 20% CPU if needed
            memory: "128Mi" # Hard ceiling for memory
      imagePullSecrets:
      - name: ghcr-secret
