<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL Playoff Stats</title>
  <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
  <!-- <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css"> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page-shell">
    <header id="header" class="container py-4 text-center">
      <h1>NHL Playoffs Center</h1>
      <p>Welcome to the NHL Playoffs Center</p>
      <nav class="nav justify-content-center">
        <a href="/">Scores</a>
        <a href="/stats">Stats</a>
        <a href="/schedule">Schedule</a>
      </nav>
    </header>

    <main class="container py-4">
      <section id="nhlStatsPage" class="page-panel mx-auto">
        <div id="sectionHeader" class="mb-4 text-center">
          <h2>Hockey Playoff Stats Leaders</h2>
        </div>
        <div id="nhlStatsOuter" class="content-panel">
          <div id="dateselect" class="mb-4 d-flex justify-content-center">
            <select id="nhlTeams"
                    name="teams"
                    hx-get="/get_nhl_teams"
                    hx-trigger="load"
                    hx-target="this"
                    hx-swap="innerHTML"
                    class="form-select w-auto bg-transparent text-light border-light">
            </select>
          </div>
          <div id="nhlscorestable"
               class="content-panel"
               name="stats"
               hx-get="/get_nhl_stats"
               hx-trigger="load, htmx:afterSwap from:#nhlTeams, change from:#nhlTeams"
               hx-target="#nhlstatscontainer"
               hx-swap="innerHTML"
               hx-include="#nhlTeams">
            <div class="row g-4" id="nhlstatscontainer"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            // get an instance of the select element
            const nhlScoreDateSelect = document.getElementById('nhlScoreDateSelect');
            // create options elements for dates starting from April 18, 2026 to May 26, 2026
            const startDate = new Date('2026-04-18');
            const endDate = new Date('2026-05-26');
            for (let date = startDate; date <= endDate; date.setDate(date.getDate() + 1)) {
                const option = document.createElement('option');
                option.value = date.toISOString().split('T')[0]; // format date as YYYY-MM-DD
                option.textContent = date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); // format date as "Month Day, Year"
                nhlScoreDateSelect.appendChild(option);
            }
        });


    </script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname.replace(/\/$/, '').replace(/^\//, '');
            document.querySelectorAll('.nav a').forEach((anchor) => {
                const href = anchor.getAttribute('href').replace(/^\//, '').replace(/\/$/, '');
                if ((path === '' && href === '') || href === path) {
                    anchor.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
