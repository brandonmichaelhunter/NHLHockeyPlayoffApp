<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL Playoffs Center</title>
  <script src="https://unpkg.com/htmx.org@2.0.0" integrity="sha384-wS5l5IKJBvK6sPTKa2WZ1js3d947pvWXbPJ1OmWfEuxLgeHcEbjUUA5i9V5ZkpCw" crossorigin="anonymous"></script>
  <!-- <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css"> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="page-shell">
    <header id="header" class="container py-4 text-center">
      <h1>NHL Playoffs Center</h1>
      <p>Welcome to the NHL Playoffs Center</p>
      <nav class="nav justify-content-center">
        <a href="/">Scores</a>
        <a href="/stats">Stats</a>
        <a href="/schedule">Schedule</a>
      </nav>
    </header>

    <main class="container py-4">
      <section id="nhlscorescontainer" class="page-panel mx-auto">
        <div id="sectionHeader" class="mb-4 text-center">
          <h2>Hockey Playoff Scores</h2>
        </div>
        <div id="nhlscorestablessection" class="content-panel">
            <div id="dateselect" class="mb-4 d-flex justify-content-center flex-wrap gap-3">
              <select id="nhlScoreDateSelect"
                  name="nhlScoreDateSelect"
                  hx-get="/nhl_scores"
                  hx-target="#nhlScores"
                  hx-trigger="change">
                <option value="">Select a Game Date</option>
              </select>
            </div>
            <div id="nhlScores" class="row gx-4 gy-4 justify-content-center align-items-stretch" hx-swap="innerHTML"></div>
          </div>
      </section>
    </main>
  </div>

  <!-- <script src="https://jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // get an instance of the select element
                const response = await fetch('/get_playoff_game_dates');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const gameDates = await response.json();
                console.log(gameDates);
                const nhlScoreDateSelect = document.getElementById('nhlScoreDateSelect');
                gameDates.forEach((gameDate) => {
                    const option = document.createElement('option');
                    option.value  = gameDate.date;
                    option.textContent = gameDate.date;
                    nhlScoreDateSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching playoff game dates:', error);
            }
        });
    </script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname.replace(/\/$/, '').replace(/^\//, '');
            document.querySelectorAll('.nav a').forEach((anchor) => {
                const href = anchor.getAttribute('href').replace(/^\//, '').replace(/\/$/, '');
                if ((path === '' && href === '') || href === path) {
                    anchor.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
